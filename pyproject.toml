[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-planning"
version = "0.1.0"
description = "Image-to-symbol grounding and PDDL planning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
